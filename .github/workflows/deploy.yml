name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: yarn build:prod

      - name: Package source
        run: |
          tar -czf deploy.tar.gz \
            --exclude=build/uploads --exclude=.env \
            build server config prisma src/shared package.json yarn.lock babel.config.json \
            .github/systemd/stat-server.service

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy.tar.gz
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail

            # Parent dir (e.g. /var/www) is root-owned on a fresh VPS
            sudo mkdir -p "$DEPLOY_PATH"
            sudo chown "$USER:$USER" "$DEPLOY_PATH"

            # .env is not in the tarball and CI cannot invent secrets
            if ! sudo test -f "$DEPLOY_PATH/.env"; then
              echo "ERROR: $DEPLOY_PATH/.env missing - create it from .env.sample first (DATABASE_URL, JWT_SECRET, ...)"
              exit 1
            fi

            TMP_DIR=$(mktemp -d)
            tar -xzf /tmp/deploy.tar.gz -C "$TMP_DIR"

            # rsync is not guaranteed on a fresh/minimal VPS
            if ! command -v rsync >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y rsync
            fi

            # Server runs via systemd as www-data (see .github/systemd/stat-server.service)
            sudo rsync -a --exclude=uploads "$TMP_DIR"/ "$DEPLOY_PATH"/
            sudo chown -R www-data:www-data "$DEPLOY_PATH"
            rm -rf "$TMP_DIR" /tmp/deploy.tar.gz

            # Fresh VPS bootstrap: Node.js >= 18 for the www-data runtime
            NODE_MAJOR=$(sudo -u www-data -H bash -lc 'node -v 2>/dev/null' | sed 's/^v//;s/\..*//')
            if [ "${NODE_MAJOR:-0}" -lt 18 ]; then
              echo 'Installing Node.js 18.x (NodeSource)...'
              sudo apt-get update -y
              sudo apt-get install -y curl ca-certificates
              sudo apt-get remove -y --purge nodejs npm libnode-dev nodejs-doc || true
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Fresh VPS bootstrap: working yarn for www-data. A corepack shim may exist
            # but fail at runtime if the VPS cannot download the pinned yarn tarball.
            if ! sudo -u www-data -H bash -lc 'yarn --version' >/dev/null 2>&1; then
              echo 'Installing yarn globally via npm...'
              sudo corepack disable 2>/dev/null || true
              sudo npm install -g yarn
            fi

            # Fresh VPS bootstrap: PostgreSQL + app role/database from DATABASE_URL
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y postgresql
            fi
            sudo systemctl enable --now postgresql

            DB_ENV=$(sudo cat "$DEPLOY_PATH/.env" | node -e '
              const s = require("fs").readFileSync(0, "utf8");
              const m = s.match(/^\s*DATABASE_URL\s*=\s*(.+?)\s*$/m);
              if (!m) { console.error("DATABASE_URL not found in .env"); process.exit(1); }
              const u = new URL(m[1].replace(/^["'"'"']|["'"'"']$/g, ""));
              const db = u.pathname.replace(/^\//, "").split("?")[0];
              [u.username, u.password, u.hostname, u.port || "5432", db]
                .forEach(v => console.log(decodeURIComponent(v)));
            ')
            mapfile -t DB <<< "$DB_ENV"
            DB_USER=${DB[0]}; DB_PASS=${DB[1]}; DB_HOST=${DB[2]}; DB_NAME=${DB[4]}

            if [ "$DB_HOST" = "localhost" ] || [ "$DB_HOST" = "127.0.0.1" ]; then
              # Escape single quotes for the SQL string literal
              DB_PASS_SQL=$(printf '%s' "$DB_PASS" | sed "s/'/''/g")
              if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='$DB_USER'" | grep -q 1; then
                sudo -u postgres psql -c "CREATE ROLE \"$DB_USER\" LOGIN PASSWORD '$DB_PASS_SQL'"
              fi
              if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'" | grep -q 1; then
                sudo -u postgres psql -c "CREATE DATABASE \"$DB_NAME\" OWNER \"$DB_USER\""
              fi
            else
              echo "DATABASE_URL host '$DB_HOST' is not local - skipping postgres role/db provisioning"
            fi

            # babel-node runtime needs devDependencies -> full install
            sudo -u www-data -H bash -lc "cd '$DEPLOY_PATH' && \
              export HOME='$DEPLOY_PATH' && \
              export npm_config_cache='$DEPLOY_PATH/.npm-cache' && \
              export YARN_CACHE_FOLDER='$DEPLOY_PATH/.yarn-cache' && \
              export YARN_PRODUCTION=false && \
              yarn install --frozen-lockfile --non-interactive --no-progress --production=false"

            # Apply DB migrations (prisma CLI auto-loads .env from cwd; needs node_modules from install)
            sudo -u www-data -H bash -lc "cd '$DEPLOY_PATH' && \
              export HOME='$DEPLOY_PATH' && \
              export npm_config_cache='$DEPLOY_PATH/.npm-cache' && \
              export YARN_CACHE_FOLDER='$DEPLOY_PATH/.yarn-cache' && \
              yarn prisma migrate deploy"

            # Install/update systemd unit and restart (creates the unit on a fresh VPS)
            # Unmask first: a masked unit is a /dev/null symlink, so tee would silently discard the unit
            sudo systemctl unmask stat-server.service 2>/dev/null || true
            sudo sed "s|{{VPS_DEPLOY_PATH}}|$DEPLOY_PATH|g" "$DEPLOY_PATH/.github/systemd/stat-server.service" | sudo tee /etc/systemd/system/stat-server.service > /dev/null
            sudo systemctl daemon-reload
            sudo systemctl enable stat-server
            sudo systemctl restart stat-server
